name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /SriHanumaChalisa/
      - name: Add Pages files
        run: |
          touch dist/sri-hanuman-chalisa/browser/.nojekyll
          cp dist/sri-hanuman-chalisa/browser/index.html dist/sri-hanuman-chalisa/browser/404.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/sri-hanuman-chalisa/browser
          branch: gh-pages
